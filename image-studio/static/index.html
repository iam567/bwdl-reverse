<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>素材 · 生图工作台</title><link rel="stylesheet" href="/static/style.css?v=55e000b8"></head><body>
<header>
  <div><span class="eyebrow">BWDL · ART PIPELINE</span><h1>生图工作台</h1></div>
  <nav>
    <span id="conn" style="color:var(--soft);font-size:12px">连接中…</span>
    <button id="toggle" style="min-width:104px">…</button>
    <a href="/" class="on">素材</a><a href="/settings">设置</a><a href="/api/logout">退出</a>
  </nav>
</header>
<div class="wrap">

  <div class="card">
    <div class="ov">
      <div>
        <div style="font-size:11px;letter-spacing:.12em;color:var(--soft)">生成进度</div>
        <p class="big"><span id="done">0</span><small> / <span id="total">0</span></small></p>
      </div>
      <div class="pct" id="pct">0%</div>
    </div>
    <progress id="bar" max="100" value="0"></progress>
    <div id="stats"></div>
    <p id="worker">读取状态…</p>
    <p class="hint">队列串行执行（服务器只有 1 核）。关掉浏览器不影响后台继续跑。
      失败的素材会保留错误信息，可以按状态筛出来单独重试。生成结果只写入 output 目录，不覆盖任何原始素材。</p>
  </div>

  <div class="card">
    <h2>素材库 <span id="results" style="color:var(--dim);font-weight:400"></span></h2>
    <div class="filters">
      <input id="q" type="search" placeholder="搜索武将名或 prompt 内容…">
      <select id="category">
        <option value="">全部分类</option>
        <option value="portrait">武将立绘</option>
        <option value="cg">全屏 CG</option>
        <option value="scene">战斗场景</option>
      </select>
      <select id="status">
        <option value="">全部状态</option>
        <option value="idle">未生成</option>
        <option value="queued">排队中</option>
        <option value="running">生成中</option>
        <option value="done">已完成</option>
        <option value="failed">失败</option>
      </select>
    </div>
    <div class="row" style="margin-bottom:16px">
      <div style="flex:0 0 auto"><button id="gen">生成选中 (<span id="nsel">0</span>)</button></div>
      <div style="flex:0 0 auto"><button id="selPage" class="ghost">选中本页</button></div>
      <div style="flex:0 0 auto"><button id="selNone" class="ghost">清空选择</button></div>
      <div style="flex:0 0 auto"><button id="genAll" class="ghost">把当前筛选结果全部入队</button></div>
      <div style="flex:1"></div>
      <div style="flex:0 0 auto"><button id="resetQ" class="danger">清空队列</button></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager">
      <button id="first" class="ghost" title="第一页">«</button>
      <button id="prev" class="ghost">上一页</button>
      <select id="pagesel" class="ghost"></select>
      <span id="page">/ 1</span>
      <button id="next" class="ghost">下一页</button>
      <button id="last" class="ghost" title="最后一页">»</button>
    </div>
  </div>

  <div class="card">
    <h2>运行记录</h2>
    <ol id="events"></ol>
  </div>
</div>

<dialog id="dlg">
  <div class="row" style="align-items:center">
    <h2 id="dTitle" style="flex:1"></h2>
    <div style="flex:0 0 auto"><button id="dClose" class="ghost">关闭</button></div>
  </div>
  <p class="hint" id="dMeta" style="margin-top:4px"></p>
  <div class="compare" id="dCompare"></div>
  <label>生图提示词</label>
  <textarea id="dPrompt"></textarea>
  <div class="row" style="margin-top:14px">
    <div style="flex:0 0 auto"><button id="dSave" class="ghost">保存提示词</button></div>
    <div style="flex:0 0 auto"><button id="dGen">生成这一张</button></div>
    <div style="flex:1"></div>
  </div>
  <p class="hint">重新生成会再次计费。改完提示词记得先保存再生成。</p>
</dialog>
<div id="toast"></div>
<script src="/static/app.js?v=9b1d2735" defer></script>
</body></html>
