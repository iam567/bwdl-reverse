<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>大地图预览</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0c0a;overflow:hidden;font:14px/1.4 -apple-system,"PingFang SC",system-ui,sans-serif;color:#e8e3da;overscroll-behavior:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab;overflow:hidden}
#stage.drag{cursor:grabbing}
#map{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}
#fx{position:fixed;inset:0;z-index:5;pointer-events:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0c0a;color:#9a9187;z-index:50;flex-direction:column;gap:10px}
#loading .bar{width:200px;height:4px;background:#2f2b26;border-radius:2px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:#c8a45c;transition:width .2s}
/* 右上角大地图按钮 */
#btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:52px;height:52px;border-radius:50%;
  background:#1c1a17e6;border:2px solid #c8a45c;color:#c8a45c;display:flex;align-items:center;justify-content:center;
  z-index:10;cursor:pointer;box-shadow:0 4px 14px #0009;backdrop-filter:blur(6px)}
#btn svg{width:26px;height:26px}
#btn:active{transform:scale(.94)}
/* 当前城名（左上） */
#where{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:14px;padding:6px 14px;border-radius:8px;
  background:#1c1a17d9;border:1px solid #3d3226;color:#f2e8d4;font-size:15px;font-weight:600;z-index:10;pointer-events:none}
/* 选中城池信息条 */
#sel{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:12;
  background:linear-gradient(180deg,#221f1af2,#14120ff2);border:1px solid #8a6f3c;border-radius:14px;
  padding:12px 16px;box-shadow:0 10px 30px #000a,inset 0 1px 0 #ffffff14;
  transform:translateY(160%);transition:transform .34s cubic-bezier(.2,.9,.25,1);pointer-events:none}
#sel.show{transform:translateY(0)}
#sel .row{display:flex;align-items:center;gap:10px}
#sel .nm{font-size:22px;font-weight:700;color:#f6e9cd;letter-spacing:.08em;
  text-shadow:0 0 14px #c8a45c66}
#sel .tag{font-size:12px;color:#d7b878;border:1px solid #6b552d;border-radius:5px;padding:2px 7px;background:#c8a45c1a}
#sel .own{margin-left:auto;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;color:#cfc4ab}
#sel .own i{width:11px;height:11px;border-radius:3px;border:1px solid #00000066;display:block}
#sel .hint{margin-top:5px;font-size:12.5px;color:#a89876;display:flex;align-items:center;gap:6px}
#sel .hint b{color:#e8c06a;font-weight:600}
/* 城内占位界面 */
#cityview{position:fixed;inset:0;z-index:36;display:none;flex-direction:column;
  background:#15110b url(/image/cityview/bg.jpg) center/cover no-repeat;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 8px)}
#cityview.show{display:flex;animation:cvin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes cvin{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
.cv-top{padding:0 0 4px}
.cv-hd{display:flex;align-items:center;gap:9px;padding:0 2px 6px}
.cv-name{font-size:30px;font-weight:700;letter-spacing:.16em;color:#f6e9cd;text-shadow:0 0 20px #c8a45c55;line-height:1.1}
.cv-meta{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:#9a8a68;letter-spacing:.14em}
.cv-own{display:flex;align-items:center;gap:5px;color:#cfc4ab;font-weight:600;letter-spacing:.06em}
.cv-own i{width:10px;height:10px;border-radius:3px;border:1px solid #0006;display:block}
.cv-tok{margin-left:auto;text-align:center;min-width:52px;padding:4px 0;
  border:1px solid #6b552d;border-radius:9px;background:#c8a45c14}
.cv-tok b{display:block;font-size:24px;font-weight:700;color:#f0c34a;line-height:1.1;
  text-shadow:0 0 12px #f0c34a55;font-style:normal}
.cv-tok i{display:block;font-size:10px;color:#9a8a68;letter-spacing:.16em;font-style:normal}
/* 数据栏：底纹是生成的帛书绢面 */
.cv-stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:0 2px}
.cv-stats{border:11px solid transparent;
  border-image:url(/image/cityview/panel.png) 58 fill / 11px / 0 stretch;
  padding:5px 6px}
.cv-stats div{display:flex;align-items:baseline;justify-content:center;gap:5px;padding:3px 1px}
.cv-stats div span{font-size:11px;font-weight:600;color:#6b5230;letter-spacing:.04em;flex:none}
.cv-stats div b{font-size:15.5px;font-weight:700;color:#2e2110;letter-spacing:.01em}
.cv-stats div b em{font-size:10px;font-style:normal;color:#6b5230;margin-left:1px}
.cv-body{flex:1;overflow:auto;padding-top:8px}
.cv-sec{font-size:12px;color:#7d7058;letter-spacing:.24em;margin-bottom:10px}
.cv-adj{display:flex;flex-wrap:wrap;gap:9px}
.cv-adj div{padding:9px 15px;border:1px solid #4a3d29;border-radius:9px;background:#181613;color:#dcd0b6;font-size:15px;cursor:pointer}
.cv-adj div:active{background:#2a2419;border-color:#c8a45c}
.cv-note{margin-top:34px;padding:18px;border:1px dashed #3a3226;border-radius:10px;color:#6f6552;text-align:center;font-size:13px;line-height:1.9}
.cv-back{width:46px;height:46px;flex:none;border-radius:11px;border:1px solid #6b552d;
  background:#c8a45c14;color:#e8c06a;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cv-back svg{width:24px;height:24px}
.cv-back:active{background:#c8a45c33}
#flash{position:fixed;inset:0;background:#fff7e6;opacity:0;pointer-events:none;z-index:38}
#cvpic{position:relative;display:none;width:100%;line-height:0}
#cvpic.show{display:block}
#cvpic img{width:100%;display:block;border-radius:10px}
#cvhl,#cvlbl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:10px}
/* 建筑指令面板 */
#bsheet{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:37;
  background:linear-gradient(180deg,#242018f2,#15120ef2);border:1px solid #8a6f3c;border-radius:14px;
  padding:12px 14px;box-shadow:0 12px 34px #000b;
  transform:translateY(calc(100% + 30px));            /* 收起时整条移出屏幕，别在底边露出一道暗边 */
  transition:transform .3s cubic-bezier(.2,.9,.25,1)}
#bsheet.show{transform:translateY(0)}
.bs-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.bs-hd b{font-size:20px;color:#f6e9cd;letter-spacing:.08em}
.bs-hd span{font-size:12px;color:#a89876}
.bs-cmds{display:flex;flex-wrap:wrap;gap:8px}
.bs-cmds div{flex:1 1 calc(50% - 8px);text-align:center;padding:11px 6px;border:1px solid #4a3d29;
  border-radius:9px;background:#191713;color:#dcd0b6;font-size:15px}
.bs-cmds div:active{background:#2a2419;border-color:#c8a45c}
/* 总览面板 */
#panel{position:fixed;inset:0;z-index:30;background:#0d0c0ad9;backdrop-filter:blur(10px);
  transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#panel.open{transform:translateX(0)}
#panel header{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:8px}
#panel header b{color:#c8a45c;font-size:16px;letter-spacing:.06em}
#close{width:40px;height:40px;border-radius:50%;background:#1c1a17;border:1px solid #3d3226;color:#e8e3da;font-size:22px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
#ovwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#ov{position:relative;touch-action:manipulation;cursor:pointer;box-shadow:0 8px 30px #000b;border-radius:6px;overflow:hidden}
#ov img{display:block;width:100%;height:100%;pointer-events:none}
#ovfx{position:absolute;inset:0;pointer-events:none}
#rect{position:absolute;border:2px solid #fff;box-shadow:0 0 0 2000px #0006,0 0 12px #000;pointer-events:none;border-radius:2px}
#ovhint{text-align:center;color:#9a9187;font-size:12px;padding-top:8px}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);left:50%;transform:translateX(-50%);
  background:#1c1a17ee;border:1px solid #c8a45c;color:#f2e8d4;padding:9px 18px;border-radius:8px;font-size:14px;z-index:40;
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style></head><body>
<div id="loading"><div>载入大地图 <span id="pct">0%</span></div><div class="bar"><i id="bari"></i></div></div>
<div id="stage"><img id="map" alt=""></div>
<canvas id="fx"></canvas>
<div id="where">—</div>
<div id="btn" title="大地图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></div>
<div id="sel"><div class="row"><div class="nm" id="selname">—</div><div class="tag" id="seltier"></div><div class="own" id="selown"></div></div>
  <div class="hint">再点一次 <b>进入城中</b> · 点空白处取消</div></div>
<div id="cityview">
  <div class="cv-top">
    <div class="cv-hd">
      <div class="cv-name" id="cvname"></div>
      <div class="cv-meta"><span id="cvtier"></span><span class="cv-own" id="cvown"></span></div>
      <div class="cv-tok" id="cvtok"><b>—</b><i>令牌</i></div>
      <div class="cv-back" id="cvback" title="返回大地图"><svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></div>
    </div>
    <div class="cv-stats" id="cvstats"></div>
  </div>
  <div class="cv-body">
    <div id="cvpic"><img id="cvimg" alt=""><canvas id="cvhl"></canvas><canvas id="cvlbl"></canvas></div>
    <div id="cvfall">
      <div class="cv-sec">相 邻 城 池</div><div class="cv-adj" id="cvadj"></div>
      <div class="cv-note">这座城的城内图还没生成<br>（目前只做了洛阳这座样板城）</div>
    </div>
  </div>
</div>
<div id="bsheet"><div class="bs-hd"><b id="bsname"></b><span id="bsfunc"></span></div>
  <div class="bs-cmds" id="bscmds"></div></div>
<div id="flash"></div>
<div id="panel">
  <header><b>天下形势</b><div id="close">×</div></header>
  <div id="ovwrap"><div id="ov"><img id="ovimg" alt=""><canvas id="ovfx"></canvas><div id="rect"></div></div></div>
  <div id="ovhint">点任一城池，视角跳转过去</div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
/* 地坪半宽（1024 坐标系）= TIER_PX × scale(0.8) × 1.35 / 3.2 / 2 ，与 compose_cities.py 贴图一致 */
const TIER_RX={1:40.50,2:35.44,3:30.38,4:26.66,5:23.29,6:20.25};
const PLATE_AR=1.5;                            // 地坪宽/高（等距压扁）
const TIER_NAME={1:'帝　都',2:'雄　城',3:'重　镇',4:'郡　城',5:'县　城',6:'寨　堡'};
let K=6.375;                                   // 1024 坐标 → 大图像素（载入后按真实尺寸校正）
const stage=$('stage'),map=$('map');
let MW=0,MH=0, s=1, tx=0, ty=0;                // 缩放、平移（CSS px）
let cities=[], byId=new Map(), adjacency={}, minS=0.05, maxS=2.2;
let vw=innerWidth,vh=innerHeight;

/* ---------- 特效层 ---------- */
const fx=$('fx'), fxc=fx.getContext('2d');
let DPR=1, raf=0, sel=null, selT0=0;
/* 势力旗 */
const MIN_FLAG_PX=26;              // 捏到最小时旗子也不低于这个高度，否则看不出势力范围
let owners={}, flagMeta={}, flagImg={}, cstats={};
const OWNER_NAME={han:'汉室·献帝',caocao:'曹操',yuanshao:'袁绍',sunjian:'孙坚',lvbu:'吕布',
  liuyan:'刘焉',liubiao:'刘表',player:'我军',spare:'——',none:'无主'};
/* 势力色由接口下发（extract/data/faction-colors.json，从 flags.js 导出）。
   旗子、小地图圆点、界面色块共用这一份，改色只改一处。 */
let OWNER_COLOR={};
const ownerOf=c=>owners[c.id]||owners[String(c.id)]||'none';
function loadFlags(ver){
  for(const k in flagMeta){ const im=new Image();
    im.onload=kick; im.src='/image/flag/web/'+k+'.png?v='+ver; flagImg[k]=im; }}
function sizeFx(){DPR=Math.min(devicePixelRatio||1,2.5);
  fx.width=Math.round(vw*DPR);fx.height=Math.round(vh*DPR);fx.style.width=vw+'px';fx.style.height=vh+'px';}
function kick(){if(!raf)raf=requestAnimationFrame(fxLoop);}
function fxLoop(now){raf=0;
  const ctx=fxc;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,fx.width,fx.height); ctx.setTransform(DPR,0,0,DPR,0,0);
  const M=s*K;
  /* 顺序要紧：聚光用 destination-out 挖洞，挖之前画的东西会被一起擦掉，
     所以先压暗地图，再画旗，最后画选中光环。 */
  if(sel) drawSpot(ctx,sel,now);
  for(const c of cities) drawFlag(ctx,c,M, sel && c.id!==sel.id ? .5 : 1);
  if(sel){ drawRing(ctx,sel,now); raf=requestAnimationFrame(fxLoop); }}

/* 旗杆着地点 = 城心上方 0.30 个地坪半径，旗插在城池上半部。
   这个高度下旗子整体落在城池图标框内，而合成时城名铜牌本来就避开图标框，
   所以 36 座城在默认缩放下零遮挡（extract/mapgen/export_boxes.py 可复验）。
   捏到最小缩放时旗子有 26px 下限、会压住个别铜牌——那个缩放下铜牌只有
   几像素读不出字，看的是势力版图，这个取舍是有意的。 */
const FLAG_OY=-0.30;

function drawFlag(ctx,c,M,alpha){
  const k=ownerOf(c), im=flagImg[k], mm=flagMeta[k];
  if(!im||!im.complete||!im.naturalWidth||!mm)return;
  const rx=TIER_RX[c.tier||4]*M;
  const h=Math.max(MIN_FLAG_PX, rx*.62), w=h*mm.w/mm.h;
  const dx=c.x*M+tx-w*mm.ax, dy=c.y*M+ty+FLAG_OY*rx-h*mm.ay;
  if(dx>vw||dy>vh||dx+w<0||dy+h<0)return;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=Math.max(3,h*.05); ctx.shadowOffsetY=Math.max(1,h*.02);
  ctx.drawImage(im,dx,dy,w,h);
  ctx.restore();}

/* 地坪半径（1024 坐标）。屏幕上不足 30px 时按下限放大，
   绘制和点击判定共用同一套数值，所以「看得见的光环」就是「点得中的范围」 */
const MIN_R_PX=30;
function ringOf(c,M){const base=TIER_RX[c.tier||4];
  const k=Math.max(1,MIN_R_PX/(base*M));
  return {rx:base*k, ry:base*k/PLATE_AR};}

function selGeom(c,now){
  const M=s*K, cx=c.x*M+tx, cy=c.y*M+ty;
  const R=ringOf(c,M), rx0=R.rx*M, ry0=R.ry*M, pad=rx0*2+80;
  if(cx<-pad||cy<-pad||cx>vw+pad||cy>vh+pad)return null;
  const p=Math.min(1,(now-selT0)/320), e=1-Math.pow(1-p,3);
  return {cx,cy,rx0,ry0,p,e,g:1.45-.45*e,a:e,br:.5+.5*Math.sin(now/620)};}

function drawSpot(ctx,c,now){                   // 压暗四周，只把选中的城留在亮处
  const G=selGeom(c,now); if(!G)return;
  ctx.save();
  ctx.fillStyle='rgba(6,5,4,'+(.46*G.a)+')';
  ctx.fillRect(0,0,vw,vh);
  ctx.globalCompositeOperation='destination-out';
  const hy=G.cy-G.rx0*.34, hr=Math.max(G.rx0*1.55,64);
  const hole=ctx.createRadialGradient(G.cx,hy,hr*.44,G.cx,hy,hr);
  hole.addColorStop(0,'rgba(0,0,0,1)');
  hole.addColorStop(.58,'rgba(0,0,0,.93)');
  hole.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=hole; ctx.beginPath(); ctx.arc(G.cx,hy,hr,0,TAU); ctx.fill();
  ctx.restore();}

function drawRing(ctx,c,now){
  const G=selGeom(c,now); if(!G)return;
  const {cx,cy,rx0,ry0,p,a,br}=G;
  const rx=rx0*G.g, ry=ry0*G.g, e=G.e;

  ctx.save(); ctx.translate(cx,cy);
  /* 2) 地面辉光 */
  ctx.save(); ctx.scale(1,1/PLATE_AR);
  const gr=ctx.createRadialGradient(0,0,rx*.08,0,0,rx*1.2);
  gr.addColorStop(0,'rgba(255,206,112,'+((.15+.07*br)*a)+')');
  gr.addColorStop(.72,'rgba(255,184,78,'+(.09*a)+')');
  gr.addColorStop(1,'rgba(255,184,78,0)');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(0,0,rx*1.2,0,TAU); ctx.fill();
  ctx.restore();
  /* 3) 主环：下半亮、上半淡，看起来像绕在城池背后的地面上 */
  const gd=ctx.createLinearGradient(0,-ry,0,ry);
  gd.addColorStop(0,   'rgba(255,238,186,'+(.20*a)+')');
  gd.addColorStop(.45, 'rgba(255,238,186,'+(.34*a)+')');
  gd.addColorStop(.74, 'rgba(255,243,202,'+(.95*a)+')');
  gd.addColorStop(1,   'rgba(255,250,224,'+(1.0*a)+')');
  ctx.strokeStyle=gd; ctx.lineWidth=3.2;
  ctx.shadowColor='rgba(255,184,62,.95)'; ctx.shadowBlur=20*a;
  ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,TAU); ctx.stroke();
  ctx.shadowBlur=0;
  /* 4) 外层顺时针虚线环 */
  const gd2=ctx.createLinearGradient(0,-ry*1.2,0,ry*1.2);
  gd2.addColorStop(0,  'rgba(240,200,112,'+(.22*a)+')');
  gd2.addColorStop(.5, 'rgba(240,200,112,'+(.40*a)+')');
  gd2.addColorStop(1,  'rgba(255,224,150,'+(.92*a)+')');
  ctx.strokeStyle=gd2; ctx.lineWidth=2;
  ctx.setLineDash([17,12]); ctx.lineDashOffset=-(now/22)%29;
  ctx.beginPath(); ctx.ellipse(0,0,rx*1.2,ry*1.2,0,0,TAU); ctx.stroke();
  ctx.setLineDash([]);
  /* 5) 四方刻度 */
  ctx.strokeStyle='rgba(255,244,206,'+(.9*a)+')'; ctx.lineWidth=2.6; ctx.lineCap='round';
  const off=rx*(.03+.03*br), L=Math.max(7,rx*.085);
  for(const[ux,uy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    if(uy<0)ctx.globalAlpha=.35;                 // 朝上那根被城挡住，淡一点
    const bx=ux*(rx*1.2+off), by=uy*(ry*1.2+off);
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+ux*L,by+uy*L); ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* 6) 脉冲波 */
  if(p>=1){const ph=((now-selT0)%1700)/1700, k=1+ph*.9;
    ctx.strokeStyle='rgba(255,220,144,'+(.5*(1-ph)*a)+')'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.ellipse(0,0,rx*k,ry*k,0,0,TAU); ctx.stroke();}
  ctx.restore();

  /* 7) 四角准星 */
  const fly=(1-e)*26;
  const l=cx-rx0*1.2-fly, r2=cx+rx0*1.2+fly, t=cy-rx0*1.18-fly, b=cy+ry0*1.5+fly;
  const CL=Math.max(11,rx0*.16);
  ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle='#ffd98a'; ctx.lineWidth=2.6; ctx.lineCap='round';
  ctx.shadowColor='rgba(255,184,62,.8)'; ctx.shadowBlur=8;
  for(const[px,py,sx2,sy2]of[[l,t,1,1],[r2,t,-1,1],[l,b,1,-1],[r2,b,-1,-1]]){
    ctx.beginPath(); ctx.moveTo(px,py+sy2*CL); ctx.lineTo(px,py); ctx.lineTo(px+sx2*CL,py); ctx.stroke();}
  ctx.restore();

  /* 8) 城头浮标 */
  const topY=cy-rx0*.98-18-Math.sin(now/480)*4;
  ctx.save(); ctx.translate(cx,topY); ctx.globalAlpha=a;
  ctx.fillStyle='#ffe08a'; ctx.shadowColor='rgba(255,170,50,.95)'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.moveTo(-10,-13); ctx.lineTo(10,-13); ctx.lineTo(0,4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- 视图 ---------- */
function apply(){map.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';updWhere();kick();}
function clamp(){const w=MW*s,h=MH*s;
  tx = w<=vw ? (vw-w)/2 : Math.min(0,Math.max(vw-w,tx));
  ty = h<=vh ? (vh-h)/2 : Math.min(0,Math.max(vh-h,ty));}
function centerOn(mx,my,animate){
  if(animate){map.style.transition='transform .55s cubic-bezier(.2,.8,.2,1)';setTimeout(()=>map.style.transition='',600);}
  tx=vw/2-mx*s; ty=vh/2-my*s; clamp(); apply();}
function tweenView(mx,my,ns,dur,done){         // mx,my 为大图像素
  const s0=s,tx0=tx,ty0=ty,t0=performance.now();
  map.style.transition='';
  (function step(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
    s=s0+(ns-s0)*e;
    tx=tx0+((vw/2-mx*ns)-tx0)*e; ty=ty0+((vh/2-my*ns)-ty0)*e;
    clamp();apply();
    if(p<1)requestAnimationFrame(step); else if(done)done();})(t0);}
function updWhere(){const cx=(vw/2-tx)/s/K, cy=(vh/2-ty)/s/K; let best=null;
  for(const c of cities){const d=Math.hypot(c.x-cx,c.y-cy); if(!best||d<best.d)best={c,d};}
  if(best)$('where').textContent=best.d<70?best.c.name:'（'+best.c.name+' 附近）';}
function resize(){vw=innerWidth;vh=innerHeight;sizeFx();
  if(MW){minS=Math.max(vw/MW,vh/MH); if(s<minS)s=minS; clamp(); apply();}
  layoutOv();}

/* ---------- 点选 ---------- */
function pickCity(sx,sy){
  const M=s*K, mx=(sx-tx)/M, my=(sy-ty)/M;      // → 1024 坐标
  let best=null;
  for(const c of cities){const R=ringOf(c,M);
    const d=Math.hypot((c.x-mx)/R.rx,(c.y-my)/R.ry);
    if(d<=1.12&&(!best||d<best.d))best={c,d};}
  return best&&best.c;}

function selectCity(c){
  sel=c; selT0=performance.now();
  $('selname').textContent=c.name;
  $('seltier').textContent=(TIER_NAME[c.tier||4]||'').replace(/\s/g,'');
  const k=ownerOf(c);
  $('selown').innerHTML='<i style="background:'+(OWNER_COLOR[k]||'#888')+'"></i>'+(OWNER_NAME[k]||'无主');
  $('sel').classList.add('show'); kick();}
function deselect(){if(!sel)return;sel=null;$('sel').classList.remove('show');kick();}
function onTap(sx,sy){
  const c=pickCity(sx,sy);
  if(!c){deselect();return;}
  if(sel&&sel.id===c.id){enterCity(c);return;}
  selectCity(c);}

/* ---------- 进入城中 ---------- */
function enterCity(c){
  $('sel').classList.remove('show');

    const f=$('flash');
    f.style.transition='opacity .12s'; f.style.opacity='.9';
    setTimeout(()=>{openCity(c); f.style.transition='opacity .4s'; f.style.opacity='0';},140);});}
/* ---------- 城内视图 ---------- */
const CITY_VIEW={13:'luoyang'};                 // 目前只做了洛阳这座样板城
const BS_CMDS={内政:['开垦','劝商','治水','巡查'],人事:['搜索','登用','奖赏','任命'],
  军事:['移动','战争','征兵','输送'],外交:['同盟','离间','招揽','情报'],
  金粮:['买入粮草','卖出粮草'],武器:['购买武器','购买马匹'],
  学院:['提升智力'],医馆:['治疗武将']};
let cvData=null, cvMask=null;                   // 蒙版画进离屏画布，点哪按像素颜色查建筑
async function loadCityView(key){
  const d=await (await fetch('/image/cityview/'+key+'.json')).json();
  const im=new Image();
  await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src='/image/cityview/'+key+'_mask.png';});
  const cv=document.createElement('canvas'); cv.width=d.size[0]; cv.height=d.size[1];
  cv.getContext('2d',{willReadFrequently:true}).drawImage(im,0,0);
  cvMask=cv; cvData=d;
  await new Promise(ok=>{const g=$('cvimg');g.onload=ok;g.src='/image/cityview/'+key+'.jpg';});
  hlKey=null; drawLabels();
}
function pickBuilding(e){
  if(!cvData||!cvMask)return null;
  const r=$('cvimg').getBoundingClientRect();
  const x=Math.round((e.clientX-r.left)/r.width*cvData.size[0]);
  const y=Math.round((e.clientY-r.top)/r.height*cvData.size[1]);
  if(x<0||y<0||x>=cvData.size[0]||y>=cvData.size[1])return null;
  const p=cvMask.getContext('2d').getImageData(x,y,1,1).data;
  for(const k in cvData.buildings){const m=cvData.buildings[k].mask;
    if(m[0]===p[0]&&m[1]===p[1]&&m[2]===p[2]) return {key:k,...cvData.buildings[k]};}
  /* 兜底：院落围墙有缺口时补洞会漏，院内空地在蒙版上是黑的
     （校场就是这种）。落在某个建筑包围盒里也算点中。 */
  let best=null;
  for(const k in cvData.buildings){const b=cvData.buildings[k].box;
    if(x>=b[0]&&x<=b[2]&&y>=b[1]&&y<=b[3]){
      const a=(b[2]-b[0])*(b[3]-b[1]);
      if(!best||a<best.a) best={a,k};}}
  return best ? {key:best.k,...cvData.buildings[best.k]} : null;
}
/* 高亮直接用蒙版的实际形状，不画方框。
   剪影 = 蒙版里颜色等于该建筑的那些像素，取出来做成一张不透明白图，
   之后压暗、描边、提亮都拿它当模板。 */
let hlSil=null, hlRaf=0;
function buildSil(b){
  const W=cvData.size[0], H=cvData.size[1];
  const src=cvMask.getContext('2d').getImageData(0,0,W,H).data;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const cx=c.getContext('2d'), out=cx.createImageData(W,H), o=out.data;
  const [r,g,bl]=b.mask;
  for(let i=0;i<src.length;i+=4)
    if(src[i]===r&&src[i+1]===g&&src[i+2]===bl){o[i]=255;o[i+1]=245;o[i+2]=210;o[i+3]=255;}
  cx.putImageData(out,0,0);
  return c;
}
function silRing(w,h,k){                         // 放大一圈剪影再挖掉原剪影 = 沿轮廓的描边
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  x.drawImage(hlSil,-k,-k,w+k*2,h+k*2);
  x.globalCompositeOperation='destination-out';
  x.drawImage(hlSil,0,0,w,h);
  return c;
}
function drawHl(now){
  hlRaf=0;
  const cv=$('cvhl'), w=cv.width, h=cv.height;
  const x=cv.getContext('2d'); x.clearRect(0,0,w,h);
  if(!hlSil)return;
  const pulse=.5+.5*Math.sin(now/520);
  x.save();                                      // 压暗四周，挖出这座建筑
  x.fillStyle='rgba(8,6,4,.48)'; x.fillRect(0,0,w,h);
  x.globalCompositeOperation='destination-out';
  x.drawImage(hlSil,0,0,w,h);
  x.restore();
  x.save();                                      // 沿轮廓的金边，随呼吸明灭
  x.shadowColor='rgba(255,190,70,.95)'; x.shadowBlur=9+7*pulse;
  x.globalAlpha=.82+.18*pulse;
  x.drawImage(silRing(w,h,Math.max(2,w*0.007)),0,0);
  x.restore();
  x.save();                                      // 建筑本身轻微提亮
  x.globalCompositeOperation='overlay'; x.globalAlpha=.12+.07*pulse;
  x.drawImage(hlSil,0,0,w,h);
  x.restore();
  hlRaf=requestAnimationFrame(drawHl);
}
function hlBuilding(b){
  const cv=$('cvhl'), r=$('cvimg').getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
  if(hlRaf){cancelAnimationFrame(hlRaf);hlRaf=0;}
  hlSil = b ? buildSil(b) : null;
  drawHl(performance.now());
}
/* ---- 建筑名匾 ---- */
const plaque=new Image(); let plaqueOK=false;
plaque.onload=()=>{plaqueOK=true;drawLabels();};
plaque.src='/image/cityview/plaque.png';
function drawLabels(){
  const cv=$('cvlbl'), img=$('cvimg');
  if(!cvData||!img.naturalWidth)return;
  const r=img.getBoundingClientRect(); if(!r.width)return;
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  const x=cv.getContext('2d'); x.clearRect(0,0,cv.width,cv.height);
  const f=cv.width/cvData.size[0];                 // 图像坐标 → 画布像素
  const fs=Math.max(9,32*f), fs2=fs*0.62;          // 匾比第一版小 30%
  for(const k in cvData.buildings){
    const b=cvData.buildings[k], bx=b.box;
    x.font='700 '+fs+'px -apple-system,"PingFang SC",system-ui,sans-serif';
    const w1=x.measureText(b.name).width;
    x.font='600 '+fs2+'px -apple-system,"PingFang SC",system-ui,sans-serif';
    const w2=x.measureText('·'+b.func).width;
    const pad=fs*0.55, pw=w1+w2+pad*2, ph=fs*1.95;
    const cxp=(bx[0]+bx[2])/2*f, byp=bx[3]*f;
    const px=Math.round(cxp-pw/2), py=Math.round(byp-ph*0.62);
    x.save();
    x.globalAlpha = (hlKey && hlKey!==k) ? .38 : 1;   // 选中某座时其余压暗
    if(plaqueOK){                                     // 三段拉伸，免得四角铜件被拉变形
      const sw=plaque.width, sh=plaque.height, cap=Math.round(sw*0.18);
      const dcap=Math.round(ph*cap/sh);
      x.drawImage(plaque,0,0,cap,sh, px,py,dcap,ph);
      x.drawImage(plaque,cap,0,sw-cap*2,sh, px+dcap,py,pw-dcap*2,ph);
      x.drawImage(plaque,sw-cap,0,cap,sh, px+pw-dcap,py,dcap,ph);
    }else{
      x.fillStyle='rgba(28,20,12,.9)'; x.strokeStyle='#c8a45c'; x.lineWidth=Math.max(1,f*3);
      x.beginPath();
      if(x.roundRect)x.roundRect(px,py,pw,ph,ph*0.18); else x.rect(px,py,pw,ph);
      x.fill(); x.stroke();
    }
    x.shadowColor='rgba(0,0,0,.85)'; x.shadowBlur=fs*0.35; x.shadowOffsetY=Math.max(1,f*2);
    x.textBaseline='middle';
    x.font='700 '+fs+'px -apple-system,"PingFang SC",system-ui,sans-serif';
    x.fillStyle='#f8efd8'; x.fillText(b.name, px+pad, py+ph/2);
    x.font='600 '+fs2+'px -apple-system,"PingFang SC",system-ui,sans-serif';
    x.fillStyle='#d3b478'; x.fillText('·'+b.func, px+pad+w1, py+ph/2+fs*0.08);
    x.restore();
  }
}
let hlKey=null;

/* ---------- 拖动 / 双指缩放 / 滚轮 ---------- */
const pts=new Map(); let last=null, pinch=null, tap=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===1){last=[e.clientX,e.clientY];stage.classList.add('drag');map.style.transition='';
    tap={x:e.clientX,y:e.clientY,t:performance.now(),ok:true};}
  if(pts.size===2){if(tap)tap.ok=false;const [a,b]=[...pts.values()];
    pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s,cx:(a[0]+b[0])/2,cy:(a[1]+b[1])/2};}
});
stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(tap&&(Math.abs(e.clientX-tap.x)>10||Math.abs(e.clientY-tap.y)>10))tap.ok=false;
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    const ns=Math.max(minS,Math.min(maxS,pinch.s*d/pinch.d)); const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;
    tx=cx-(pinch.cx-tx)*(ns/s); ty=cy-(pinch.cy-ty)*(ns/s); s=ns; pinch.cx=cx;pinch.cy=cy; clamp();apply();return;}
  if(pts.size===1&&last){tx+=e.clientX-last[0];ty+=e.clientY-last[1];last=[e.clientX,e.clientY];clamp();apply();}
});
const up=e=>{const wasTap=tap&&tap.ok&&pts.size===1&&performance.now()-tap.t<520;
  pts.delete(e.pointerId);if(pts.size<2)pinch=null;
  if(pts.size===0){last=null;stage.classList.remove('drag');
    if(wasTap)onTap(tap.x,tap.y); tap=null;}
  else if(pts.size===1){last=[...pts.values()][0];}};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;const ns=Math.max(minS,Math.min(maxS,s*f));
  tx=e.clientX-(e.clientX-tx)*(ns/s);ty=e.clientY-(e.clientY-ty)*(ns/s);s=ns;clamp();apply();},{passive:false});

/* ---------- 总览面板 ---------- */
const panel=$('panel'),ov=$('ov'),ovimg=$('ovimg'),rect=$('rect');
let ovW=0,ovH=0;
/* 总览标记（势力色圆点 + 城名）运行时画。烤进底图的话城池易主后颜色就不对了。 */
const OV_R={1:13,2:11,3:9,4:8,5:7,6:6};        // 半径，1024 坐标下的值
/* 手机上面板只有 350 左右，按比例算出来的点太小认不出颜色，放大并给个下限 */
const ovR=(c,f)=>Math.max(4.5, OV_R[c.tier||4]*f*1.25);
function drawOv(){
  const cv=$('ovfx'); if(!ovW||!cities.length)return;
  const dp=Math.min(devicePixelRatio||1,2.5);
  cv.width=Math.round(ovW*dp); cv.height=Math.round(ovH*dp);
  cv.style.width=ovW+'px'; cv.style.height=ovH+'px';
  const x=cv.getContext('2d'); x.setTransform(dp,0,0,dp,0,0);
  x.clearRect(0,0,ovW,ovH);
  const f=ovW/1024, fs=Math.max(9,15*f);
  x.font='600 '+fs+'px -apple-system,"PingFang SC",system-ui,sans-serif';
  x.textAlign='center'; x.textBaseline='top';
  const sorted=cities.slice().sort((a,b)=>a.y-b.y);
  for(const c of sorted){
    const cx=c.x*f, cy=c.y*f, R=ovR(c,f);
    x.fillStyle='rgba(20,16,10,.43)';
    x.beginPath(); x.arc(cx,cy,R+3*f,0,TAU); x.fill();
    x.fillStyle=OWNER_COLOR[ownerOf(c)]||'#8A8578';
    x.beginPath(); x.arc(cx,cy,R,0,TAU); x.fill();
    x.strokeStyle='#faf8f2'; x.lineWidth=Math.max(1,2.2*f); x.stroke();
    if((c.tier||4)<=2){ x.beginPath(); x.arc(cx,cy,R-Math.max(1.5,4*f),0,TAU);
      x.lineWidth=Math.max(.8,1.6*f); x.stroke(); }
  }
  for(const c of sorted){
    const cx=c.x*f, cy=c.y*f, R=ovR(c,f);
    const w=x.measureText(c.name).width, ty=cy+R+3*f, pad=fs*.34;
    x.fillStyle='rgba(22,17,10,.82)';
    x.beginPath();
    if(x.roundRect) x.roundRect(cx-w/2-pad, ty, w+pad*2, fs*1.34, 3);
    else            x.rect(cx-w/2-pad, ty, w+pad*2, fs*1.34);
    x.fill();
    x.fillStyle='#f6eede'; x.fillText(c.name, cx, ty+fs*.16);
  }}
function layoutOv(){const wrap=$('ovwrap');const aw=wrap.clientWidth,ah=wrap.clientHeight;if(!aw||!ah)return;
  const side=Math.min(aw,ah); ovW=ovH=side; ov.style.width=side+'px';ov.style.height=side+'px'; drawOv(); updRect();}
function updRect(){if(!MW||!ovW)return;const f=ovW/1024;
  const x0=(-tx)/s/K, y0=(-ty)/s/K, w=vw/s/K, h=vh/s/K;
  rect.style.left=(x0*f)+'px';rect.style.top=(y0*f)+'px';rect.style.width=(w*f)+'px';rect.style.height=(h*f)+'px';}
function openPanel(){layoutOv();updRect();panel.classList.add('open');}
function closePanel(){panel.classList.remove('open');}
$('btn').onclick=openPanel; $('close').onclick=closePanel;
ov.addEventListener('click',e=>{const r=ov.getBoundingClientRect();const f=1024/ovW;
  const x=(e.clientX-r.left)*f, y=(e.clientY-r.top)*f; let best=null;
  for(const c of cities){const d=Math.hypot(c.x-x,c.y-y);if(!best||d<best.d)best={c,d};}
  if(best&&best.d<28){closePanel();setTimeout(()=>{centerOn(best.c.x*K,best.c.y*K,true);selectCity(best.c);},120);}
});
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove('show'),1400);}

/* ---------- 载入 ---------- */
async function loadImg(url,onprog){const r=await fetch(url);const total=+r.headers.get('content-length')||0;
  const reader=r.body.getReader();const chunks=[];let got=0;
  for(;;){const {done,value}=await reader.read();if(done)break;chunks.push(value);got+=value.length;if(total)onprog(got/total);}
  return URL.createObjectURL(new Blob(chunks,{type:'image/jpeg'}));}
(async()=>{
  const d=await (await fetch('/api/edit/cities')).json();
  cities=d.cities.map(c=>({id:c.id,name:c.name,x:+c.x,y:+c.y,tier:c.tier||4}));
  byId=new Map(cities.map(c=>[c.id,c]));
  adjacency=d.adjacency||{};
  owners=d.owners||{}; flagMeta=d.flags||{}; loadFlags(d.flagVersion||0); cstats=d.stats||{};
  for(const k in (d.factions||{})) OWNER_COLOR[k]=d.factions[k].hex;
  ovimg.src='/image/map/overview_1024.jpg?v='+(d.overviewVersion||0);
  const url=await loadImg('/image/map/map_L2_with_cities.jpg?v='+(d.mapVersion||0),
    p=>{$('pct').textContent=Math.round(p*100)+'%';$('bari').style.width=(p*100)+'%';});
  await new Promise(res=>{map.onload=res;map.src=url;});
  MW=map.naturalWidth;MH=map.naturalHeight;
  K=MW/1024;                                   // 按真实尺寸校正，光环才能正好套住城池
  vw=innerWidth;vh=innerHeight;sizeFx();
  s=Math.max(innerWidth*devicePixelRatio/1170, Math.max(vw/MW,vh/MH));
  s=Math.min(s,1); minS=Math.max(vw/MW,vh/MH);
  const start=cities.find(c=>c.name==='陈留')||cities[0];
  centerOn(start.x*K,start.y*K,false);
  $('loading').style.display='none';
  addEventListener('resize',resize);
})();
</script></body></html>
